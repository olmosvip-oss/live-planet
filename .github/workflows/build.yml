name: Build Loopwright

# Builds only when asked (a test build) or for a release (the release branch or a v... tag),
# not on every change: build minutes are limited while the repository is private.
on:
  push:
    branches: [release]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      licensed:
        description: "Build the version you sell (7-day trial, then a license code)"
        type: boolean
        default: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libfreetype6-dev libfontconfig1-dev libcurl4-openssl-dev libgl1-mesa-dev libjack-jackd2-dev

      # The version you sell: release tags (v1.0.0 ...) or a manual run with "licensed" ticked get the
      # public key, so buyers get the 7-day trial and then need a code. Everything else stays unlocked for testing.
      # Set the repository variable LOOPWRIGHT_BUY_URL (https://your-site/api/checkout) for the Buy button.
      - name: Configure
        shell: bash
        run: |
          EXTRA=()
          if [[ "${{ github.ref }}" == refs/tags/v* || "${{ github.ref }}" == refs/heads/release || "${{ inputs.licensed }}" == "true" ]]; then
            EXTRA+=("-DLOOPWRIGHT_PUBLIC_KEY=$(tr -d '\r\n' < packaging/license-public-key.txt)")
            BUY="${{ vars.LOOPWRIGHT_BUY_URL }}"
            EXTRA+=("-DLOOPWRIGHT_BUY_URL=${BUY:-https://loop-wright.com/api/checkout}")
            echo "licensed build"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "${EXTRA[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Collect plugins
        shell: bash
        run: |
          mkdir -p dist
          ART=build/LivePlanet_artefacts/Release
          cp -R "$ART/VST3/Loopwright.vst3" dist/
          cp -R "$ART/CLAP/Loopwright.clap" dist/
          if [ -d "$ART/AU" ]; then cp -R "$ART/AU/Loopwright.component" dist/; fi
          if [ -d "$ART/Standalone/Loopwright.app" ]; then cp -R "$ART/Standalone/Loopwright.app" dist/;
          elif [ -f "$ART/Standalone/Loopwright.exe" ]; then cp "$ART/Standalone/Loopwright.exe" dist/;
          else cp "$ART/Standalone/Loopwright" dist/; fi
          cp INSTALL.md dist/

      # Mac: sign each bundle (ad-hoc) and zip with ditto, which keeps the
      # executable permissions that GitHub's own artifact zip throws away.
      - name: Sign and package (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_DEV_ID_APP: ${{ secrets.MACOS_DEV_ID_APP }}
          MACOS_DEV_ID_INSTALLER: ${{ secrets.MACOS_DEV_ID_INSTALLER }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          lipo -info "dist/Loopwright.vst3/Contents/MacOS/Loopwright"   # should list x86_64 and arm64
          bash packaging/mac/sign.sh
          mkdir -p package
          ditto -c -k --keepParent dist "package/Loopwright-macOS.zip"

      # the installer: double-click to put every plugin in place (signed + notarized once the Apple secrets exist)
      - name: Installer (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true   # never let the installer hold back the plain zip
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_DEV_ID_APP: ${{ secrets.MACOS_DEV_ID_APP }}
          MACOS_DEV_ID_INSTALLER: ${{ secrets.MACOS_DEV_ID_INSTALLER }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: bash packaging/mac/build-pkg.sh "0.1.${{ github.run_number }}"

      - name: Upload installer (macOS)
        if: runner.os == 'macOS' && hashFiles('package/Loopwright.pkg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Loopwright-macOS-Installer
          path: package/Loopwright.pkg

      - name: Upload (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Loopwright-macOS
          path: package/Loopwright-macOS.zip

      # Windows: one installer (plugins where every DAW looks, the app with a Start menu shortcut)
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) {
            # (allowed to fail: when the package site is down, NSIS's own download below is used instead)
            $ErrorActionPreference = 'Continue'
            $PSNativeCommandUseErrorActionPreference = $false
            try { choco install nsis --no-progress -y } catch { Write-Host "choco failed: $_" }
            $ErrorActionPreference = 'Stop'
          }
          if (-not (Test-Path $nsis)) {
            # (the package site can be down: NSIS's own download instead)
            Invoke-WebRequest -Uri "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.10/nsis-3.10.zip" -OutFile nsis.zip -MaximumRetryCount 4 -RetryIntervalSec 5
            Expand-Archive nsis.zip -DestinationPath nsis-tool -Force
            $nsis = (Get-ChildItem nsis-tool -Recurse -Filter makensis.exe | Select-Object -First 1).FullName
          }
          New-Item -ItemType Directory -Force package | Out-Null
          & $nsis "/DAPPVERSION=0.9.${{ github.run_number }}" "/DSRC=$PWD\dist" "/DOUTDIR=$PWD\package" packaging\windows\loopwright.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem package

      - name: Upload installer (Windows)
        if: runner.os == 'Windows' && hashFiles('package/Loopwright-Setup.exe') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Loopwright-Windows-Installer
          path: package/Loopwright-Setup.exe

      - name: Upload
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Loopwright-${{ matrix.name }}
          path: dist

  # A push to the "release" branch (or a release tag): one Loopwright.zip with everything, published as a
  # GitHub release (version 0.9.<run number>).
  # The website serves it at loop-wright.com/api/download, so buyers never leave the site.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Put everything in one zip
        run: |
          set -e
          mkdir -p Loopwright/Mac Loopwright/Windows
          if [ -f art/Loopwright-macOS-Installer/Loopwright.pkg ]; then
            cp art/Loopwright-macOS-Installer/Loopwright.pkg Loopwright/Mac/
          fi
          # the plugins on their own too, for installing by hand
          (cd Loopwright/Mac && unzip -q ../../art/Loopwright-macOS/Loopwright-macOS.zip && mv dist "Plugins (install by hand)")
          # Windows: the installer, and the plugins and app on their own for installing by hand
          if [ -f art/Loopwright-Windows-Installer/Loopwright-Setup.exe ]; then
            cp art/Loopwright-Windows-Installer/Loopwright-Setup.exe Loopwright/Windows/
            cp packaging/windows/READ-ME-FIRST.txt Loopwright/Windows/
            mkdir -p "Loopwright/Windows/Plugins (install by hand)"
            cp -R art/Loopwright-Windows/. "Loopwright/Windows/Plugins (install by hand)/"
          else
            cp -R art/Loopwright-Windows/. Loopwright/Windows/
          fi
          rm -f Loopwright/Windows/INSTALL.md "Loopwright/Windows/Plugins (install by hand)/INSTALL.md" "Loopwright/Mac/Plugins (install by hand)/INSTALL.md"
          cp INSTALL.md Loopwright/INSTALL.md
          cp THIRD_PARTY_NOTICES.md Loopwright/ 2>/dev/null || true
          zip -q -r -y Loopwright.zip Loopwright
          ls -la Loopwright.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then TAG="v0.9.${GITHUB_RUN_NUMBER}"; fi
          gh release create "$TAG" Loopwright.zip --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --latest \
            --title "Loopwright $TAG" --notes "Mac installer, Windows installer, and the plugins on their own. 7-day free trial; activate with your license code."
