name: Build Loopwright

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libfreetype6-dev libfontconfig1-dev libcurl4-openssl-dev libgl1-mesa-dev libjack-jackd2-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Collect plugins
        shell: bash
        run: |
          mkdir -p dist
          ART=build/LivePlanet_artefacts/Release
          cp -R "$ART/VST3/Loopwright.vst3" dist/
          cp -R "$ART/CLAP/Loopwright.clap" dist/
          if [ -d "$ART/AU" ]; then cp -R "$ART/AU/Loopwright.component" dist/; fi
          if [ -d "$ART/Standalone/Loopwright.app" ]; then cp -R "$ART/Standalone/Loopwright.app" dist/;
          elif [ -f "$ART/Standalone/Loopwright.exe" ]; then cp "$ART/Standalone/Loopwright.exe" dist/;
          else cp "$ART/Standalone/Loopwright" dist/; fi
          cp INSTALL.md dist/

      # Mac: sign each bundle (ad-hoc) and zip with ditto, which keeps the
      # executable permissions that GitHub's own artifact zip throws away.
      - name: Sign and package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          lipo -info "Loopwright.vst3/Contents/MacOS/Loopwright"   # should list x86_64 and arm64
          for b in *.vst3 *.component *.clap *.app; do
            [ -e "$b" ] && codesign --force --deep -s - "$b"
          done
          cd ..
          mkdir -p package
          ditto -c -k --keepParent dist "package/Loopwright-macOS.zip"

      # the installer: double-click to put every plugin in place (signed + notarized once the Apple secrets exist)
      - name: Installer (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_DEV_ID_APP: ${{ secrets.MACOS_DEV_ID_APP }}
          MACOS_DEV_ID_INSTALLER: ${{ secrets.MACOS_DEV_ID_INSTALLER }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: bash packaging/mac/build-pkg.sh "0.1.${{ github.run_number }}"

      - name: Upload installer (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Loopwright-macOS-Installer
          path: package/Loopwright.pkg

      - name: Upload (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Loopwright-macOS
          path: package/Loopwright-macOS.zip

      - name: Upload
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Loopwright-${{ matrix.name }}
          path: dist
