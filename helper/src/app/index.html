<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loopwright Voice</title>
<style>
:root{--bg:#0b0b0f;--body:#1b1b1d;--light:#232326;--dark:#121213;--ink:#f2f2f3;--dim:#9a9aa3;--line:#2c2c30;--a:#b9a2ff;--b:#8b5cf6;--c:#5b34c9;--g:#8ef0c8;--bad:#ff8f8f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 70% -10%,#2a1c52 0,transparent 70%),var(--bg);color:var(--ink);font:15px/1.5 ui-rounded,-apple-system,system-ui,sans-serif;min-height:100vh}
header{display:flex;align-items:baseline;gap:12px;padding:22px 28px 6px;letter-spacing:.22em;font-weight:700}header span{letter-spacing:0;font-weight:400;color:var(--dim)}
main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;padding:16px 28px 40px;max-width:1240px;margin:auto}@media(max-width:860px){main{grid-template-columns:minmax(0,1fr);padding:16px}header{padding:20px 16px 0;flex-wrap:wrap}}
.p{position:relative;background:linear-gradient(#17171d,#0e0e13);border:1px solid #ffffff12;border-radius:18px;padding:18px;margin-bottom:16px;overflow:hidden}.p.glow:after{content:"";position:absolute;inset:55% 0 -30%;background:radial-gradient(closest-side,#8b5cf633,transparent);pointer-events:none}
h2{font-size:13px;margin:0 0 10px;color:var(--dim);font-weight:600}label{display:block;color:var(--dim);font-size:13px;margin-bottom:5px}
textarea,input,select{width:100%;background:#0a0a0e;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font:inherit;position:relative;z-index:1}textarea{resize:vertical;min-height:250px;font-size:17px;line-height:1.65}textarea.s{min-height:62px;font-size:15px}:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:12px;position:relative;z-index:1}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;position:relative;z-index:1}
button{font:inherit;color:var(--ink);background:var(--light);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}button:hover{border-color:var(--a)}button[aria-pressed=true]{background:var(--c);border-color:var(--a)}
#go{width:100%;padding:16px;font-size:17px;font-weight:700;background:linear-gradient(180deg,var(--b),var(--c));border:0;box-shadow:0 0 34px #8b5cf655}#go:disabled{opacity:.45;cursor:default;box-shadow:none}
.up{display:flex;gap:8px;align-items:center}.up select{flex:1;min-width:0}input[type=range]{padding:0;accent-color:var(--b);height:28px;border:0;background:none}.val{float:right;color:var(--ink)}.ck{display:flex;gap:9px;align-items:flex-start;color:var(--ink);font-size:14px;margin:12px 0}.ck input{width:18px;height:18px;margin-top:2px;accent-color:var(--b)}
canvas{width:100%;height:150px;display:block}ol{list-style:none;margin:8px 0 0;padding:0}ol li{display:flex;gap:12px;align-items:center;padding:8px 0;color:var(--dim)}ol i{width:13px;height:13px;border-radius:50%;background:#2c2c36;flex:none}li.now{color:var(--ink)}li.now i{background:var(--b);box-shadow:0 0 16px var(--b)}li.ok i{background:var(--g)}li small{margin-left:auto;color:var(--dim)}
.res{border:1px solid #ffffff12;border-radius:14px;padding:14px;margin-top:12px;background:#0a0a0e}.res audio{width:100%;margin-top:8px}.bar{height:6px;border-radius:9px;background:#26262e;overflow:hidden}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--a))}.m{display:grid;grid-template-columns:54px 1fr 44px;gap:10px;align-items:center;font-size:13px;color:var(--dim);margin-top:6px}.heard{color:var(--dim);font-size:13px;margin:8px 0 0}a{color:var(--a)}#msg{color:var(--bad);min-height:1.5em;margin:8px 0 0}
</style></head><body>
<header>LOOPWRIGHT <span>voice</span></header>
<main><section>
 <div class="p glow"><h2>Lyrics</h2><textarea id="lyrics" aria-label="Lyrics" placeholder="[Chorus]&#10;Type one line per phrase.&#10;Start each part with a tag like [Verse] or [Chorus]."></textarea>
  <div class="chips" id="tags"></div><p id="fit" class="heard"></p></div>
 <div class="p"><h2>Vocal style</h2><textarea id="style" class="s" aria-label="Vocal style" placeholder="smooth male R&amp;B, catchy chorus, long held notes"></textarea><div class="chips" id="styles"></div></div>
</section><section>
 <div class="p"><h2>Your track and voice</h2>
  <label for="track">Track (WAV, 8 to 60 seconds works best)</label><div class="up"><select id="track"></select><button data-up="track">Add</button></div>
  <label for="voice" style="margin-top:12px">Voice</label><div class="up"><select id="voice"></select><button data-up="voice">Add</button></div><input type="file" id="file" accept=".wav,audio/wav" hidden>
  <div class="row"><div><label for="key">Key (minor)</label><select id="key"></select></div><div><label for="bpm">BPM</label><input id="bpm" type="number" min="50" max="220" value="118"></div><div><label for="takes">Takes</label><select id="takes"><option>2<option selected>4<option>6<option>8</select></div><div><label for="results">Versions</label><select id="results"><option>1<option selected>2<option>3</select></div></div>
  <div class="row"><div><label for="tune">Tuning <span class="val" id="tv"></span></label><input id="tune" type="range" min="0" max="100" value="95"></div><div><label for="runs">Runs <span class="val" id="rv"></span></label><input id="runs" type="range" min="0" max="8" value="3"></div></div>
  <label class="ck"><input id="clean" type="checkbox" checked><span>Remove background noise (adds a couple of minutes per version)</span></label>
  <label class="ck"><input id="ok" type="checkbox"><span>This is my voice, or I have the singer's permission</span></label>
  <button id="go">Create vocal</button><p id="msg" role="alert"></p></div>
 <div class="p glow"><h2 id="jt">What's happening</h2><canvas id="cv" width="900" height="300" aria-hidden="true"></canvas><ol id="st" aria-live="polite"></ol><button id="cancel" hidden>Stop</button><div id="out"></div></div>
</section></main>
<script>
const T="__TOKEN__",$=i=>document.getElementById(i);let stages=[],cur=null,shown="",last={};
const post=(u,b,raw)=>fetch(u,{method:"POST",headers:{"X-Token":T},body:raw?b:JSON.stringify(b)}).then(async r=>{const j=await r.json();if(!r.ok)throw Error(j.error);return j});
const el=(t,p={},...k)=>{const e=Object.assign(document.createElement(t),p);e.append(...k);return e};
for(const t of ["[Verse]","[Chorus]","[Bridge]"])$("tags").append(el("button",{textContent:t,onclick(){const a=$("lyrics"),v=a.value;a.value=v+(v&&!v.endsWith("\n")?"\n\n":"")+t+"\n";a.focus();fit()}}));
for(const t of ["male R&B","female R&B","tenor","baritone","breathy","soulful","long held notes","rhythmic","falsetto","stacked hook"])$("styles").append(el("button",{textContent:t,ariaPressed:"false",onclick(){const L=$("style").value.split(",").map(x=>x.trim()).filter(Boolean),i=L.indexOf(t);i<0?L.push(t):L.splice(i,1);$("style").value=L.join(", ");mark()}}));
const mark=()=>{const L=$("style").value.split(",").map(x=>x.trim());[...$("styles").children].forEach(b=>b.setAttribute("aria-pressed",L.includes(b.textContent)))};$("style").oninput=mark;
"C C# D D# E F F# G G# A A# B".split(" ").forEach(k=>$("key").append(el("option",{textContent:k})));
const fit=()=>{const n=$("lyrics").value.split("\n").filter(x=>x.trim()&&!x.trim().startsWith("[")).length;$("fit").textContent=n?`${n} line${n>1?"s":""}: aim for a track of about ${n*8} seconds so words aren't rushed or repeated.`:""};$("lyrics").oninput=fit;
const sl=()=>{$("tv").textContent=$("tune").value+"%";$("rv").textContent=$("runs").value};$("tune").oninput=$("runs").oninput=sl;sl();
async function opts(track,voice){const o=await (await fetch("/api/options")).json();stages=o.stages;for(const [id,L,s] of [["track",o.tracks,track],["voice",o.voices,voice]]){const keep=s||$(id).value;$(id).replaceChildren(...L.map(x=>el("option",{textContent:x,value:x,selected:x===keep})))}}
document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{$("file").onchange=async()=>{const f=$("file").files[0];if(!f)return;try{const r=await post(`/api/upload?kind=${b.dataset.up}&name=${encodeURIComponent(f.name)}`,f,true);await opts(b.dataset.up==="track"?r.name:0,b.dataset.up==="voice"?r.name:0);$("msg").textContent=""}catch(e){$("msg").textContent=e.message}$("file").value=""};$("file").click()});
$("go").onclick=async()=>{$("msg").textContent="";$("go").disabled=true;try{const r=await post("/api/create",{lyrics:$("lyrics").value,style:$("style").value,track:$("track").value,voice:$("voice").value,key:$("key").value,bpm:+$("bpm").value,takes:+$("takes").value,results:+$("results").value,tune:$("tune").value/100,runs:+$("runs").value,clean:$("clean").checked,consent:$("ok").checked});cur=r.id;shown=""}catch(e){$("msg").textContent=e.message;$("go").disabled=false}poll()};
$("cancel").onclick=()=>post("/api/cancel",{id:cur}).catch(e=>$("msg").textContent=e.message);
const clock=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
function meter(n,v){return el("div",{className:"m"},n,el("div",{className:"bar"},Object.assign(el("b"),{style:`width:${v}%`})),v+"%")}
async function poll(){try{const L=await (await fetch("/api/jobs")).json(),j=L.find(x=>x.id===cur)||L[0];last=j||{};if(j){cur=j.id;const live=["queued","running"].includes(j.state);$("go").disabled=live;$("cancel").hidden=!live;
 $("jt").textContent=j.state==="done"?"Ready: "+j.title:j.state==="error"?"Something went wrong":j.state==="cancelled"?"Stopped":j.state==="queued"?"Waiting for the current song":`Working on: ${j.title} (${clock(Date.now()/1e3-j.created)})`;
 const at=stages.findIndex(s=>s[0]===j.stage);$("st").replaceChildren(...stages.filter(s=>s[0]!=="clean"||j.opts.clean).map(s=>{const i=stages.indexOf(s),now=live&&i===at;return el("li",{className:j.state==="done"||i<at?"ok":now?"now":""},el("i"),s[1],el("small",{textContent:now?j.note:""}))}));
 if(j.state==="error")$("msg").textContent=j.error;
 const sig=j.id+j.results.length;if(sig!==shown){shown=sig;$("out").replaceChildren(...j.results.map(r=>el("div",{className:"res"},el("strong",{textContent:"Version "+r.n}),meter("Words",r.words||0),meter("Key",r.key||0),el("p",{className:"heard",textContent:r.heard?"Guide heard as: "+r.heard:""}),el("div",{className:"heard",textContent:"With your track"}),el("audio",{controls:true,src:r.mix}),el("div",{className:"heard",textContent:"Vocal only"}),el("audio",{controls:true,src:r.vocal}),el("a",{href:r.vocal,download:`loopwright_vocal_${r.n}.wav`,textContent:"Save vocal WAV"}))))}}}catch(e){$("jt").textContent="Helper isn't running"}}
const cv=$("cv"),x=cv.getContext("2d"),calm=matchMedia("(prefers-reduced-motion: reduce)").matches;function draw(t){const w=cv.width,h=cv.height,live=last.state==="running",k=Math.max(0,stages.findIndex(s=>s[0]===last.stage)),a=live?.25+.13*k:last.state==="done"?.6:.1;x.clearRect(0,0,w,h);for(let n=0;n<4;n++){x.beginPath();for(let i=0;i<=w;i+=6){const p=i/w,e=Math.sin(Math.PI*p),y=h/2+Math.sin(p*(7+n*2)+t/(live?420:1800)*(n%2?1:-1)+n)*Math.cos(p*3+n)*e*h*.42*a*(1-n*.15);i?x.lineTo(i,y):x.moveTo(i,y)}x.strokeStyle=["#b9a2ff","#8b5cf6","#8ef0c8","#5b34c9"][n];x.globalAlpha=.9-n*.16;x.lineWidth=4-n*.6;x.shadowColor="#8b5cf6";x.shadowBlur=live?22:8;x.stroke()}x.globalAlpha=1;if(!calm)requestAnimationFrame(draw)}
opts().then(poll);setInterval(poll,1500);draw(0);
</script></body></html>
